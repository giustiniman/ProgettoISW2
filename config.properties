# Clone locale di Apache OpenJPA. Se non esiste, viene creato automaticamente.
repository.path=work/repositories/openjpa
repository.url=https://github.com/apache/openjpa.git

# API Jira Apache e progetto da analizzare.
jira.base.url=https://issues.apache.org/jira
jira.project=OPENJPA

# OpenJPA usa soprattutto tag X.Y.Z; alcune release hanno anche openjpa-parent-X.Y.Z.
# Il primo pattern risolvibile vince.
git.tag.patterns=${version},openjpa-parent-${version},${version}-incubating

# Se una release Jira valida non ha un tag, usa l'ultimo commit precedente
# alla release sul ramo indicato (stessa strategia adottata da Meola).
git.date.fallback.ref=refs/remotes/origin/master

# Le slide richiedono di ignorare l'ultimo 66%: viene usato ceil(N/3).
release.fraction=0.3333333333333333

output.csv=output/openjpa_milestone1.csv
work.directory=work
